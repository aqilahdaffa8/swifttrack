name: swift_track
description: Live GPS Tracker & Multi-Courier Parcel Monitor.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State Management
  provider: ^6.1.2
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  flutter_polyline_points: ^2.0.0
  
  # Networking & Local Storage
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  
  # UI & Animations
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true